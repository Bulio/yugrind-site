 if(tab==='pro'){h+=`<div class="chal"><img src="img/logo.png" style="width:120px;border-radius:50%" alt=""><h2>Unità avanzate in arrivo</h2><p style="margin:8px 0;opacity:.9">Preflop avanzato, matematica, flop, turn e river, tornei e ICM. Intanto rigioca le prime due unità e sfida le Leggende.</p></div>`}
 if(tab==='hr'){h+=`<div class="table"><div style="font-size:60px">🎰</div><h2 style="margin:6px">Tavoli High Roller</h2></div><div class="card center"><small style="color:var(--mut)">${PRO?'SESSIONI':'SESSIONI GRATIS OGGI'}</small><div class="big">${PRO?'∞':S.hr}</div><p style="color:var(--mut)">Mani per sessione</p><div class="hands">${[5,10,20,50].map(n=>`<button class="${n===5?'on':''}" onclick="this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on'));this.classList.add('on')">${n}</button>`).join('')}</div><button class="btn" onclick="startHR()">Continua</button></div>`}
 if(tab==='me'){h+=`<div class="card center">${IMG('coach').replace('masc','masc hero')}<h3>${S.nome}</h3><p>Poker IQ: <b>${S.iq??'non misurato'}</b></p><p>XP totali: <b>${S.xp}</b></p><p>Lezioni completate: <b>${S.done.length}</b> / ${UNITS.reduce((a,u)=>a+u.lez.length,0)}</p><p>Leggende battute: <b>${S.leg.length}</b> / ${LEGENDS.length}</p><p>Serie giorni: <b>🔥 ${S.streak}</b></p><div class="badges">${BADGES.map(([id,i,t])=>`<div class="badge ${(S.badges||[]).includes(id)?'on':''}" title="${t}">${i}<small>${t}</small></div>`).join('')}</div>${S.iq!=null?'<button class="btn" onclick="share()">📤 Condividi il tuo Poker IQ</button>':''}<button class="btn sec" style="color:var(--ink);border-color:#ccd" onclick="S.mute=!S.mute;save();render()">${S.mute?'🔇 Suoni spenti':'🔊 Suoni accesi'}</button><p>Piano: <b>${PRO?'PRO ✅ ('+PRO.plan+')':'Gratis'}</b></p>${PRO?(PRO.plan!=='lifetime'?'<button class="btn sec" style="color:var(--ink)" onclick="portal()">Gestisci abbonamento</button>':''):'<button class="btn" onclick="paywall()">Passa a PRO</button><button class="btn sec" style="color:var(--ink);border-color:#ccd" onclick="restore()">Ripristina acquisto</button>'}<button class="btn" onclick="startIQ()">Rifai il test Poker IQ</button><button class="btn red" onclick="if(confirm('Azzerare i progressi?')){localStorage.removeItem('ap');location.reload()}">Azzera progressi</button></div>`}
 app.innerHTML=h+`<footer>Solo formazione: niente soldi veri, niente premi · I progressi restano solo nel tuo browser · Il gioco d'azzardo è vietato ai minori e può causare dipendenza: Telefono Verde ISS 800 558822 · <a href="/">YUGRIND</a> di Giuliano Puggioni, P.IVA 02505340907 · <a href="/it/privacy/">Privacy</a></footer>`+nav();
}
function startQuiz(qs,kind,meta){qs=qs.map(q=>{const idx=shuf([0,1,2,3]);return{...q,o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a)}});quiz={qs,i:0,ok:0,kind,meta,ans:null};render()}
function dayQ(){const qs=ALLQ_();let h=0;for(const c of today)h=(h*31+c.charCodeAt(0))>>>0;return qs[h%qs.length]}
function startDay(){if(S.dayDone===today)return toast('Mano del giorno già fatta: torna domani!');startQuiz([dayQ()],'day')}
const BADGES=[['first','🎯','Prima lezione',()=>S.done.length>=1],['u1','📗','Unità 1 completata',()=>[0,1,2,3].every(i=>S.done.includes('0-'+i))],['leg1','🥊','Prima Leggenda battuta',()=>S.leg.length>=1],['s3','🔥','3 giorni di fila',()=>S.streak>=3],['s7','🌟','7 giorni di fila',()=>S.streak>=7],['xp1k','⚡','1.000 XP',()=>S.xp>=1000],['iq130','🧠','Poker IQ 130+',()=>(S.iq||0)>=130],['all8','👑','Tutte le Leggende',()=>S.leg.length>=8]];
function checkBadges(){S.badges=S.badges||[];BADGES.forEach(([id,i,t,f])=>{if(!S.badges.includes(id)&&f()){S.badges.push(id);setTimeout(()=>{toast('Nuovo traguardo: '+i+' '+t);snd('win')},1700)}});save()}
async function share(){const t=`Il mio Poker IQ è ${S.iq??'?'} su PokerLab Italia 🧠♠ Riesci a battermi?`,u=location.origin==='null'?'':location.origin;ev('share');try{if(navigator.share)await navigator.share({title:'PokerLab Italia',text:t,url:u});else{await navigator.clipboard.writeText(t+' '+u);toast('Copiato! Incollalo dove vuoi')}}catch(e){}}
function startIQ(){startQuiz(IQTEST(),'iq')}
function startLesson(u,l){startQuiz(UNITS[u].lez[l].q,'lez',u+'-'+l)}
function startLegend(i){const u=UNITS[LEGENDS[i].u];startQuiz(shuf(u.lez.flatMap(l=>l.q)).slice(0,8),'leg',i)}
function startHR(){if(!PRO){if(S.hr<=0){toast('Sessioni gratis finite per oggi');return paywall()}S.hr--;save()}const n=+(document.querySelector('.hands .on')?.textContent||5);startQuiz(shuf(ALLQ_()).slice(0,n),'hr')}
function renderQuiz(){
 const q=quiz.qs[quiz.i];const coach=quiz.kind==='leg'?LEGENDS[quiz.meta].av:IMG('coach');
 let h=`<div class="top"><span style="cursor:pointer;font-size:22px" onclick="go(tab)">✕</span><div class="pill">${quiz.i+1}/${quiz.qs.length}</div></div><div class="bar"><i style="width:${quiz.i/quiz.qs.length*100}%"></i></div>
 <div class="q" style="margin:16px"><div class="coach">${coach}</div><div class="bubble">${cards(q.d)}</div></div>`;
 q.o.forEach((o,i)=>{let c='';if(quiz.ans!=null){if(i===q.a)c='ok';else if(i===quiz.ans)c='ko'}h+=`<div class="opt ${c}" onclick="answer(${i})">${cards(o)}</div>`});
 if(quiz.ans!=null){const ok=quiz.ans===q.a;h+=`<div class="fb ${ok?'ok':'ko'}"><b>${ok?(quiz.kind==='day'?'✅ Giusto! +20 XP (doppi)':'✅ Giusto! +10 XP'):'❌ Risposta sbagliata'}</b><p style="margin-top:6px">${cards(q.x)}</p></div><div style="margin:0 16px"><button class="btn ${ok?'':'red'}" onclick="next()">Continua</button></div>`}
 app.innerHTML=h;
}
function answer(i){if(quiz.ans!=null)return;quiz.ans=i;const ok=i===quiz.qs[quiz.i].a;if(ok){quiz.ok++;S.xp+=quiz.kind==='day'?20:10;save()}snd(ok?'ok':'ko');renderQuiz()}
function next(){quiz.i++;quiz.ans=null;if(quiz.i<quiz.qs.length)return renderQuiz();
 const r=quiz.ok/quiz.qs.length;let msg;
 if(quiz.kind==='iq'){S.iq=Math.round(70+r*90);msg='Il tuo Poker IQ è '+S.iq;tab='me'}
 if(quiz.kind==='lez'){if(!S.done.includes(quiz.meta))S.done.push(quiz.meta);S.xp+=20;msg='Lezione completata! +20 XP'}
 if(quiz.kind==='leg'){const b=Math.round(LEGENDS[quiz.meta].xp*r);S.xp+=b;if(r>=.75&&!S.leg.includes(quiz.meta))S.leg.push(quiz.meta);msg=r>=.75?'Hai battuto la Leggenda! +'+b+' XP':'La Leggenda ha vinto ('+quiz.ok+'/8). +'+b+' XP'}
 if(quiz.kind==='day'){S.dayDone=today;msg=quiz.ok?'Mano del giorno vinta! Torna domani 🔥':'Domani ci riprovi!'}
 if(quiz.kind==='hr'){msg='Sessione finita: '+quiz.ok+'/'+quiz.qs.length}
 if(S.lastDay!==today){S.streak++;S.lastDay=today}save();pushScore();checkBadges();if(r>=.75){confetti();snd('win')}else snd('coin');ev('fine_'+quiz.kind);quiz=null;toast(msg);render()}
render();claim();loadPro();ev('open');
</script></body></html>
